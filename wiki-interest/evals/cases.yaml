cases:
  - name: astronomy_uk_pl
    query: "Compare astronomy interest in UK and Polish Wikipedia over 24 months"
    command: "run \"Astronomy\" --langs uk,pl --months 24"
    expect:
      - "run_id" in response
      - response["langs_found"] includes "uk"
      - response["langs_found"] includes "pl"
      - all values in response["results"] have "confidence" key
      - all values in response["results"] have "caveats" key

  - name: intermittent_fasting_missing_lang
    query: "Is intermittent fasting interest growing in Polish and Czech Wikipedia?"
    command: "run \"Intermittent fasting\" --langs pl,cs --months 24"
    expect:
      - "run_id" in response
      - "pl" in response["langs_missing"]  # No pl article for this topic
      - "cs" in response["langs_found"]
      - response["results"]["cs"]["confidence"] in ["high", "medium", "low"]

  - name: ambiguous_topic
    query: "Search for Mercury"
    command: "resolve \"Mercury\" --langs uk,en"
    expect:
      - response["error"] == "ambiguous_topic"
      - len(response["candidates"]) >= 2
      - "hint" in response

  - name: unknown_topic
    query: "Search for nonexistent topic"
    command: "resolve \"xyz_nonexistent_xyz\" --langs uk"
    expect:
      - response["error"] == "unknown_topic"
      - "hint" in response

  - name: qid_direct
    query: "Analyze Q333 (Astronomy) directly"
    command: "run \"\" --langs uk,pl --qids Q333 --months 24"
    expect:
      - "run_id" in response
      - len(response["langs_found"]) == 2

  - name: short_period
    query: "Analyze with only 6 months of data"
    command: "run \"Astronomy\" --langs uk --months 6"
    expect:
      - "run_id" in response
      - response["results"]["uk"]["confidence"] == "low"
      - "short_history" in response["results"]["uk"]["caveats"]
