[project]
name = "wiki-interest"
version = "0.1.0"
description = "Analyze Wikipedia pageview trends across languages."
authors = [
    { name = "sasha55sh", email = "150395476+sasha55sh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymannkendall>=1.4.3",
    "scipy>=1.18.1",
]

[project.scripts]
wiki-interest = "wiki_interest.cli:main"


[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "scripts"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
